type: layout
size: huge
layouts:
    - "1/1"
    - "1/2, 1/2"
    - "1/3, 2/3"
    - "2/3, 1/3"
    - "1/3, 1/3, 1/3"
settings:
    fields:
        role:
            type: select
            width: 1/2
            label: Layout Role
            options:
                default: Default
                header: Header
                ticker: Ticker
                layout-gallery: Gallery
                feature: Feature
                accordion: Accordion Group
                full-width: Full Width
        gapDefault:
            type: gap
            width: 1/2
            when:
                role: default
        gapHeader:
            type: gap
            width: 1/2
            when:
                role: header

        featureBG:
            type: color
            width: 1
            label: Block Background Color
            mode: options
            default: "#f6f0e6"
            options:
                "#ccccff": "Cobalt"
                "#ffccd0": "Benibana"
                "#e69696": "Cinnabar"
                "#f6f0e6": "Paper"
                "#b4b7ad": "Paynes"
                "#b893f3": "Violet"
                "#fded8e": "Gold"
                "#00d700": "Green"
            when:
                role: feature
        featureTC:
            type: color
            width: 1
            label: Block Text Color
            mode: options
            default: "#0000ff"
            options:
                "#0000ff": "Cobalt"
                "#ff99a1": "Benibana"
                "#b82b2b": "Cinnabar"
                "#f6f0e6": "Paper"
                "#4e5147": "Paynes"
                "#4c12a8": "Violet"
                "#fcdf39": "Gold"
                "#000000": "Black"
            when:
                role: feature

        accordionBG:
            type: color
            width: 1
            label: Block Background Color
            mode: options
            default: "#f6f0e6"
            options:
                "#ccccff": "Cobalt"
                "#ffccd0": "Benibana"
                "#e69696": "Cinnabar"
                "#f6f0e6": "Paper"
                "#b4b7ad": "Paynes"
                "#b893f3": "Violet"
                "#fded8e": "Gold"
                "#00d700": "Green"
            when:
                role: accordion
        accordionTC:
            type: color
            width: 1
            label: Block Text Color
            mode: options
            default: "#0000ff"
            options:
                "#0000ff": "Cobalt"
                "#ff99a1": "Benibana"
                "#b82b2b": "Cinnabar"
                "#f6f0e6": "Paper"
                "#4e5147": "Paynes"
                "#4c12a8": "Violet"
                "#fcdf39": "Gold"
                "#000000": "Black"
            when:
                role: accordion
        openDefault:
            type: toggle
            width: 1/2
            label: Default Open
            when:
                role: accordion

        tickerLength:
            type: number
            width: 1/2
            label: Time for Ticker
            when:
                role: ticker
            after: s
        tickerColor:
            type: color
            width: 1/2
            label: Ticker Background Color
            mode: options
            default: "#0000ff"
            options:
                "#0000ff": "Cobalt"
                "#ff99a1": "Benibana"
                "#b82b2b": "Cinnabar"
                "#f6f0e6": "Paper"
                "#4e5147": "Paynes"
                "#4c12a8": "Violet"
                "#fcdf39": "Gold"
                "#00d700": "Green"
            when:
                role: ticker
        tickerTextColor:
            type: color
            label: Ticker Text Color
            width: 1/2
            mode: options
            default: "#f6f0e6"
            options:
                "#0000ff": "Cobalt"
                "#ff99a1": "Benibana"
                "#b82b2b": "Cinnabar"
                "#f6f0e6": "Paper"
                "#4e5147": "Paynes"
                "#4c12a8": "Violet"
                "#fcdf39": "Gold"
                "#00b300": "Green"
            when:
                role: ticker
        tickerDirection:
            type: toggle
            label: Animation Direction
            width: 1/2
            text:
                - "Right to Left"
                - "Left to Right"
            when:
                role: ticker
        class:
            type: text
            width: 1/2
        layoutId:
            type: text
            width: 1/2
fieldsets:
    text:
        label: Text
        type: group
        fieldsets:
            heading: true
            text: true
            list: true
            line: true
            quote: true
            accordion: true
            bio: true
            button:
                preview: fields
                fields:
                    buttonText:
                        type: text
                        label: Button Text
                    buttonLink:
                        type: link
                    buttonVariant:
                        type: select
                        options:
                            - "primary"
                            - "secondary"
                            - "tertiary"
            newsletter:
                preview: fields
                fields:
                    label:
                        type: text
                        label: Label
                    emailPlaceholder:
                        type: text
                        label: Email Placeholder
                    namePlaceholder:
                        type: text
                        label: Name Placeholder
    media:
        label: Media
        type: group
        fieldsets:
            image:
                extends: blocks/image
                fields:
                    full:
                        label: Full Width
                        type: toggle
                        text:
                            - "no"
                            - "yes"
            video: true
            gallery: true
    code:
        label: Code
        type: group
        open: false
        fieldsets:
            - code
            - markdown
