title: Artist Profile
icon: 🧑🏽‍🎨
num: zero

tabs:
    content:
        icon: edit
        columns:
            main:
                width: 2/3
                sections:
                    fields:
                        type: fields
                        fields:
                            bio:
                                type: layout
                                label: Bio
                                extends: fields/layout
            side:
                width: 1/3
                sections:
                    sidebarFields:
                        type: fields
                        fields:
                            mediums:
                                type: tags
                                label: Primary Mediums
                            profilepic:
                                type: files
                                multiple: false
                                label: Profile Image
                                layout: cards
                            birth:
                                type: text
                                label: Birth Year
    media:
        sections:
            files:
                type: files
    security:
        icon: lock
        columns:
            - width: 1/3
              fields:
                  pageProtect: fields/locked-pages

    settings:
        icon: cog
        extends: layouts/page-settings
