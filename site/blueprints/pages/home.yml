title: Home Page

tabs:
  content:
    columns:
      main:
        width: 1
        sections:
          fields:
            type: fields
            fields:
              text:
                extends: fields/layout
                fieldsets:
                  text:
                    fieldsets:
                      featuredArtist:
                        preview: fields
                        label: Featured Artist
                        fields:
                          link:
                            type: link
                            options:
                              - page
                              - url
                              - anchor
                          topText:
                            type: text
                            label: Top Text
                          bottomText:
                            type: text
                            label: Bottom Text
                          image:
                            type: files
                            multiple: false
                    

  media:
    sections:
      files:
        type: files
  security:
    icon: lock
    columns:
      - width: 1/3
        fields:
          pageProtect: fields/locked-pages
  
  settings:
    icon: cog
    extends: layouts/page-settings