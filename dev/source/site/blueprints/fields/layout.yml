
type: layout
size: huge
layouts:
  - "1/1"
  - "1/2, 1/2"
  - "1/3, 2/3"
  - "2/3, 1/3"
  - "1/3, 1/3, 1/3"
settings:
  fields:
    role:
      type: select
      width: 1/2
      label: Layout Role
      options:
        default: Default
        header: Header
        ticker: Ticker
        layout-gallery: Gallery
        feature: Feature
    gapDefault:
      type: gap
      width: 1/2
      when:
        role: default
    gapHeader:
      type: gap
      width: 1/2
      when:
        role: header
    tickerLength:
      type: number
      width: 1/2
      label: Time for Ticker
      when:
        role: ticker
      after: s
    tickerColor:
      type: color
      width: 1/2
      label: Ticker Background Color
      mode: options
      default: "#1a4bd5"
      options:
        "Cobalt": "#1a4bd5"
        "Benibana": "#ff99a1"
        "Cinnabar": "#b82b2b"
        "Paper": "#f6f0e6"
        "Paynes": "#4e5147"
        "Violet": "#4c12a8"
        "Gold": "#fcdf39"
      when:
        role: ticker
    tickerTextColor:
      type: color
      label: Ticker Text Color
      width: 1/2
      mode: options
      default: "#f6f0e6"
      options:
        "Cobalt": "#1a4bd5"
        "Benibana": "#ff99a1"
        "Cinnabar": "#b82b2b"
        "Paper": "#f6f0e6"
        "Paynes": "#4e5147"
        "Violet": "#4c12a8"
        "Gold": "#fcdf39"
      when:
        role: ticker
    tickerDirection:
      type: toggle
      label: Animation Direction
      width: 1/2
      text:
        - "Right to Left"
        - "Left to Right"
      when:
        role: ticker
    class:
      type: text
      width: 1/2
    id:
      type: text
      width: 1/2
fieldsets:
  text:
    label: Text
    type: group
    fieldsets:
      - heading
      - text
      - list
      - line
      - quote
      newsletter:
        preview: fields
        fields:
          label:
            type: text
            label: Label
          emailPlaceholder:
            type: text
            label: Email Placeholder
          namePlaceholder:
            type: text
            label: Name Placeholder
  media:
    label: Media
    type: group
    fieldsets:
      image:
        extends: blocks/image
        fields:
          full:
            label: Full Width
            type: toggle
            text:
              - "no"
              - "yes"
      - video
      - gallery
  code:
    label: Code
    type: group
    open: false
    fieldsets:
      - code
      - markdown