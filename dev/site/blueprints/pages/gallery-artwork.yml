title: Artwork
icon: 🖼

create:
  fields:
    - artist

tabs:
  content:
    icon: edit
    columns:
      left:
        width: 1/2
        fields:
          primaryImg:
            type: files
            label: Primary Image
            uploads: images
            layout: cards
            size: huge
            multiple: false
            image:
              back: white
              ratio: 1/1
          details:
            type: files
            label: More Images
            uploads: images
            layout: cards
            size: small
            image:
              back: white
              ratio: 1/1
      right:
        width: 1/2
        fields:
          publishdate:
            type: date
            default: today
            label: Date Published
          artId:
            type: text
            label: Art ID
          year:
            type: text
            label: Year
          artist:
            label: Artist
            help: The artist this was produced with.
            type: tags
            icon: false
            options:
              type: query
              query: site.find('artists').children.listed
              text: "{{ page.title }} ({{ page.slug }})"
              value: "{{ page.slug }}"
          price:
            label: Price
            width: 1/2
            type: number
            min: 0
            before: $
            help: In USD$

          available:
            label: Availability
            width: 1/2
            type: toggle
            text:
              - "Not Available"
              - "Available"
          text:
            label: Top text
            help: Wall label stuff such as Title, Year, Size, Materials, etc.
            type: writer
            nodes: true
          accordionText:
            label: Accordion Text
            extends: fields/layout
            settings:
              fields:
                role:
                  default: accordion
            fieldsets:
              text:
                fieldsets:
                  bio:
                    label: Artist Bio
                    preview: fields
                    fields:
                      artistlink:
                        label: Artist to Link
                        type: pages
                        multiple: false
                        query: site.find('artists')
          stickers:
            label: Stickers
            type: structure
            fields:
              stickerLabel:
                type: text
                label: Label
                width: 1/2

  e-commerce:
    label: E-Commerce
    icon: cart
    sections:
      productdata:
        type: fields
        fields:
          onlineShop:
            type: toggle
            label: E Commerce Availability
            width: 1/4
          maxQty:
            type: number
            label: Max QTY Allowed
            width: 1/4
            when:
              onlineShop: true
          productinfo: 
            extends: cart/product
            when:
              onlineShop: true
            fields:
              productTotal: false
              productName: false
              productID: false
              productPrice: false
              productDescriptionLong: false
              gap1:
                type: gap
              frameTitle:
                label: Framing Options
                type: headline
                width: 1/2
              framable:
                type: toggle
                label: Add Framing?
                width: 1/2
              frame:
                type: number
                step: .01
                label: Frame Add. Cost
                width: 1/3
                before: $
                help: Frame cost if only one option for framing. Set to 0.00 or blank if you will give Optium and OP3 costs separate.
                when:
                  framable: true
              frameDimensions:
                type: headline
                label: Updated Package Dimensions for Frame
                when:
                  framable: true
              framedPackageWeight:
                type: number
                label: Weight in OUNCES
                after: ozs
                width: 1/4
                when:
                  framable: true
              framedPackageWidth:
                type: number
                label: Width (in.)
                width: 1/4
                after: in
                when:
                  framable: true
              framedPackageLength:
                type: number
                label: Length (in.)
                width: 1/4
                after: in
                when:
                  framable: true
              framedPackageHeight:
                type: number
                label: Height (in.)
                width: 1/4
                after: in
                when:
                  framable: true

  media:
    label: Media
    icon: images
    sections:
      files:
        type: files
        layout: cards
        size: tiny
        image:
          back: white
          ratio: 1/1
  
  settings:
    icon: cog
    extends: layouts/page-settings