
title: Merchandise Grid
icon: 🛍️

tabs:
  content:
    icon: edit
    columns:

      main:
        width: 1
        sections:
          fields:
            type: fields
            fields:
              text:
                extends: fields/layout
          portfolio:
            type: pages
            label: Merchandise
            layout: cards
            size: large
            empty: No merch yet.
            templates: merch-product
            image:
              query: page.productImage.toFile
              back: white
              ratio: 1/1
              cover: false
            search: true
            info: "{{page.productID}} — ${{page.productPrice}}"
  media:
    sections:
      files:
        type: files
  security:
    icon: lock
    columns:
      - width: 1/3
        fields:
          pageProtect: fields/locked-pages
  
  settings:
    icon: cog
    extends: layouts/page-settings

