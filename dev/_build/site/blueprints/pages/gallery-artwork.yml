title: Artwork
icon: 🖼

create:
  fields:
    - artist

tabs:
  content:
    icon: edit
    columns:
      left:
        width: 1/2
        fields:
          primaryImg:
            type: files
            label: Primary Image
            uploads: images
            layout: cards
            size: huge
            multiple: false
            image:
              back: white
              ratio: 1/1
          details:
            type: files
            label: More Images
            uploads: images
            layout: cards
            size: small
            image:
              back: white
              ratio: 1/1
      right:
        width: 1/2
        fields:
          publishdate:
            type: date
            default: today
            label: Date Published
          artId:
            type: text
            label: Art ID
          year:
            type: text
            label: Year
          artist:
            label: Artist
            help: The artist this was produced with.
            type: tags
            icon: false
            options:
              type: query
              query: site.find('artists').children.listed
              text: "{{ page.title }} ({{ page.slug }})"
              value: "{{ page.slug }}"
          price:
            label: Price
            width: 1/2
            type: number
            min: 0
            before: $
            help: In USD$

          available:
            label: Availability
            width: 1/2
            type: toggle
            text:
              - "Not Available"
              - "Available"
          text:
            label: Top text
            help: Wall label stuff such as Title, Year, Size, Materials, etc.
            type: writer
            nodes: true
          bottomText:
            label: Bottom Text
            help: Other text you might want to add to the page
            type: writer
            nodes: true

  e-commerce:
    label: E-Commerce
    icon: cart
    sections:
      productdata:
        type: fields
        fields:
          onlineShop:
            type: toggle
            label: E Commerce Availability
            width: 1/4
          maxQty:
            type: number
            label: Max QTY Allowed
            width: 1/4
            when:
              onlineShop: true
          productinfo: 
            extends: cart/product
            when:
              onlineShop: true
            fields:
              productTotal: false
              productName: false
              productID: false
              productPrice: false
              productDescription:
                width: 1
                type: textarea
                buttons: false
              productImage:
                width: 1/2
          
          packageInfo:
            label: Package Info
            type: headline
            width: 1
          packageWeight:
            type: number
            label: Weight in Grams
            width: 1/4
          packageWidth:
            type: number
            label: Width in CM
            width: 1/4
          packageHeight:
            type: number
            label: Height in CM
            width: 1/4
          packageLength:
            type: number
            label: Length in CM
            width: 1/4
          

  media:
    label: Media
    icon: images
    sections:
      files:
        type: files
        layout: cards
        size: tiny
        image:
          back: white
          ratio: 1/1
  
  settings:
    icon: cog
    extends: layouts/page-settings