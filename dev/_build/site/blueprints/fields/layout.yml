
type: layout
size: huge
layouts:
  - "1/1"
  - "1/2, 1/2"
  - "1/3, 2/3"
  - "2/3, 1/3"
  - "1/3, 1/3, 1/3"
settings:
  fields:
    role:
      type: select
      width: 1/2
      label: Layout Role
      options:
        default: Default
        header: Header
        ticker: Ticker
        layout-gallery: Gallery
        feature: Feature
        accordion: Accordion Item
    gapDefault:
      type: gap
      width: 1/2
      when:
        role: default
    gapHeader:
      type: gap
      width: 1/2
      when:
        role: header

    featureBG:
      type: color
      width: 1
      label: Block Background Color
      mode: options
      default: "#1a4bd5"
      options:
        "Cobalt": "#6666ff"
        "Benibana": "#ff99a1"
        "Cinnabar": "#dd6c6c"
        "Paper": "#f6f0e6"
        "Paynes": "#b4b7ad"
        "Violet": "#9a65ee"
        "Gold": "#e5c303"
        "Green": "#00b300"
      when:
        role: feature
    featureTC:
      type: color
      width: 1
      label: Block Text Color
      mode: options
      default: "#1a4bd5"
      options:
        "Cobalt": "#1a4bd5"
        "Benibana": "#ff99a1"
        "Cinnabar": "#b82b2b"
        "Paper": "#f6f0e6"
        "Paynes": "#4e5147"
        "Violet": "#4c12a8"
        "Gold": "#fcdf39"
        "Black": "#000000"
      when:
        role: feature

    accordionBG:
      type: color
      width: 1
      label: Block Background Color
      mode: options
      default: "#f6f0e6"
      options:
        "Cobalt": "#6666ff"
        "Benibana": "#ff99a1"
        "Cinnabar": "#dd6c6c"
        "Paper": "#f6f0e6"
        "Paynes": "#b4b7ad"
        "Violet": "#9a65ee"
        "Gold": "#e5c303"
        "Green": "#00b300"
      when:
        role: accordion
    accordionTC:
      type: color
      width: 1
      label: Block Text Color
      mode: options
      default: "#1a4bd5"
      options:
        "Cobalt": "#1a4bd5"
        "Benibana": "#ff99a1"
        "Cinnabar": "#b82b2b"
        "Paper": "#f6f0e6"
        "Paynes": "#4e5147"
        "Violet": "#4c12a8"
        "Gold": "#fcdf39"
        "Black": "#000000"
      when:
        role: accordion

    tickerLength:
      type: number
      width: 1/2
      label: Time for Ticker
      when:
        role: ticker
      after: s
    tickerColor:
      type: color
      width: 1/2
      label: Ticker Background Color
      mode: options
      default: "#1a4bd5"
      options:
        "Cobalt": "#1a4bd5"
        "Benibana": "#ff99a1"
        "Cinnabar": "#b82b2b"
        "Paper": "#f6f0e6"
        "Paynes": "#4e5147"
        "Violet": "#4c12a8"
        "Gold": "#fcdf39"
      when:
        role: ticker
    tickerTextColor:
      type: color
      label: Ticker Text Color
      width: 1/2
      mode: options
      default: "#f6f0e6"
      options:
        "Cobalt": "#1a4bd5"
        "Benibana": "#ff99a1"
        "Cinnabar": "#b82b2b"
        "Paper": "#f6f0e6"
        "Paynes": "#4e5147"
        "Violet": "#4c12a8"
        "Gold": "#fcdf39"
      when:
        role: ticker
    tickerDirection:
      type: toggle
      label: Animation Direction
      width: 1/2
      text:
        - "Right to Left"
        - "Left to Right"
      when:
        role: ticker
    class:
      type: text
      width: 1/2
    layoutId:
      type: text
      width: 1/2
fieldsets:
  text:
    label: Text
    type: group
    fieldsets:
      - heading
      - text
      - list
      - line
      - quote
      button:
        preview: fields
        fields:
          buttonText:
            type: text
            label: Button Text
          buttonLink:
            type: link
      newsletter:
        preview: fields
        fields:
          label:
            type: text
            label: Label
          emailPlaceholder:
            type: text
            label: Email Placeholder
          namePlaceholder:
            type: text
            label: Name Placeholder
  media:
    label: Media
    type: group
    fieldsets:
      image:
        extends: blocks/image
        fields:
          full:
            label: Full Width
            type: toggle
            text:
              - "no"
              - "yes"
      - video
      - gallery
  code:
    label: Code
    type: group
    open: false
    fieldsets:
      - code
      - markdown