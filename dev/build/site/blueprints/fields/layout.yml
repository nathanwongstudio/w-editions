layouts:
  - "1/1"
  - "1/2, 1/2"
  - "1/3, 2/3"
  - "2/3, 1/3"
  - "1/3, 1/3, 1/3"
settings:
  fields:
    role:
      type: select
      width: 1/2
      label: Layout Role
      options:
        default: Default
        header: Header
        ticker: Ticker
        layout-gallery: Gallery
    gapDefault:
      type: gap
      width: 1/2
      when:
        role: default
    gapHeader:
      type: gap
      width: 1/2
      when:
        role: header
    tickerLength:
      type: number
      label: Time for Ticker
      width: 1/2
      when:
        role: ticker
      after: s
    class:
      type: text
      width: 1/2
    id:
      type: text
      width: 1/2
fieldsets:
  text:
    label: Text
    type: group
    fieldsets:
      - heading
      - text
      - list
      - line
      - quote
  media:
    label: Media
    type: group
    fieldsets:
      image:
        extends: blocks/image
        fields:
          full:
            label: Full Width
            type: toggle
            text:
              - "no"
              - "yes"
      - video
      - gallery
  code:
    label: Code
    type: group
    open: false
    fieldsets:
      - code
      - markdown