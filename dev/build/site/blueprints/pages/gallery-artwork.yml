title: Artwork
icon: 🖼

tabs:
  content:
    icon: edit
    columns:
      left:
        width: 1/2
        fields:
          primaryImg:
            type: files
            label: Primary Image
            uploads: images
            layout: cards
            size: huge
            multiple: false
            image:
              back: white
              ratio: 1/1
          primaryImgCaption:
            type: writer
            label: Primary Image Gallery Caption
            help: This text only shows up in some gallery formats.
            inline: true
          details:
            type: files
            label: More Images
            uploads: images
            layout: cards
            size: small
            image:
              back: white
              ratio: 1/1
      right:
        width: 1/2
        fields:
          artId:
            type: text
            label: Art ID
          year:
            type: text
            default: "2023"
            label: Year
          artist:
            label: Artist
            help: The artist this was produced with.
            type: tags
            icon: false
            options:
              type: query
              query: site.find('artists').children.listed
          price:
            label: Price
            width: 1/2
            type: number
            min: 0
            before: $
            help: In USD$
          available:
            label: Availability
            width: 1/2
            type: toggle
            text:
              - "Not Available"
              - "Available"
          text:
            label: Top text
            help: Wall label stuff such as Title, Year, Size, Materials, etc.
            type: writer
            nodes: true
          bottomText:
            label: Bottom Text
            help: Other text you might want to add to the page
            type: writer
            nodes: true

  attached:
    label: Attached Media
    icon: images
    sections:
      files:
        type: files
        layout: cards
        size: tiny
        image:
          back: white
          ratio: 1/1