title: Artwork
icon: 🖼

create:
  fields:
    - artist

tabs:
  content:
    icon: edit
    columns:
      top:
        width: 1
        fields:
          shopifyProduct:
            type: toggle
            label: Link to Shopify?
            width: 1/4
          shopifyProductLink:
            width: 3/4
            type: pages
            multiple: false
            label: Shopify Product
            query: site.index.findBy("intendedTemplate", "shopify.products") 
            when:
              shopifyProduct: true
      left:
        width: 1/2
        fields:
          primaryImg:
            type: files
            label: Primary Image
            uploads: images
            layout: cards
            size: huge
            multiple: false
            image:
              back: white
              ratio: 1/1
          details:
            type: files
            label: More Images
            uploads: images
            layout: cards
            size: small
            image:
              back: white
              ratio: 1/1
      right:
        width: 1/2
        fields:
          publishdate:
            type: date
            default: today
            label: Date Published
          artId:
            type: text
            label: Art ID
          year:
            type: text
            label: Year
          artist:
            label: Artist
            help: The artist this was produced with.
            type: tags
            icon: false
            options:
              type: query
              query: site.find('artists').children.listed
              text: "{{ page.title }} ({{ page.slug }})"
              value: "{{ page.slug }}"
          price:
            label: Price
            width: 1/2
            type: number
            min: 0
            before: $
            help: In USD$
            when:
              shopifyProduct: false

          available:
            label: Availability
            width: 1/2
            type: toggle
            text:
              - "Not Available"
              - "Available"
          text:
            label: Top text
            help: Wall label stuff such as Title, Year, Size, Materials, etc.
            type: writer
            nodes: true
          bottomText:
            label: Bottom Text
            help: Other text you might want to add to the page
            type: writer
            nodes: true

  media:
    label: Media
    icon: images
    sections:
      files:
        type: files
        layout: cards
        size: tiny
        image:
          back: white
          ratio: 1/1